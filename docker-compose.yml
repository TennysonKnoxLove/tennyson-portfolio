version: "3.8"

services:
  web:
    build:
      context: .
      target: web
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      API_URL: http://api:8000
    depends_on:
      - api

  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/app/backend/entrypoint.sh"]
    volumes:
      - ./backend:/app/backend
      - ./prisma:/app/prisma

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
