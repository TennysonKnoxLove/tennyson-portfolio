<div class="uc-shell">
  <header class="uc-shell-header">
    <button type="button" class="brand" (click)="nav.goHome()">
      <span class="brand-mark">UC</span>
      <span class="brand-name">University Connect</span>
    </button>

    <nav class="shell-nav" aria-label="University Connect">
      <button
        type="button"
        class="shell-tab"
        [class.active]="(nav.view$ | async) === 'home'"
        (click)="nav.goHome()">
        Home
      </button>
      <button
        type="button"
        class="shell-tab"
        [class.active]="(nav.view$ | async) === 'about'"
        (click)="nav.goAbout()">
        About
      </button>
      <button
        type="button"
        class="shell-tab"
        [class.active]="(nav.view$ | async) === 'browse'"
        (click)="nav.goBrowse()">
        Browse
      </button>
      <button
        type="button"
        class="shell-tab"
        [class.active]="(nav.view$ | async) === 'upload'"
        (click)="nav.goUpload()">
        Upload
      </button>
    </nav>

    <span class="shell-spacer"></span>

    <button
      mat-icon-button
      type="button"
      class="fullscreen-button"
      (click)="toggleFullscreen()"
      [attr.aria-label]="fullscreen ? 'Exit fullscreen' : 'Enter fullscreen'">
      <mat-icon>{{ fullscreen ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
    </button>
    <button mat-icon-button type="button" class="close-button" (click)="closeDialog()" aria-label="Close demo">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <div class="uc-shell-body">
    <app-university-connect-home *ngIf="(nav.view$ | async) === 'home'"></app-university-connect-home>
    <app-university-connect-about *ngIf="(nav.view$ | async) === 'about'"></app-university-connect-about>
    <app-resource-listing *ngIf="(nav.view$ | async) === 'browse'"></app-resource-listing>
    <app-resource-upload *ngIf="(nav.view$ | async) === 'upload'"></app-resource-upload>
  </div>
  <app-resource-detail *ngIf="nav.selectedResource$ | async"></app-resource-detail>
</div>
